<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Данные и знания — AIOS Технологического института</title>
<link rel="stylesheet" href="css/style.css?v=20260911">
</head>
<body>
<div class="layout">

  <aside class="sidebar">
    <a class="wordmark" href="index.html">
      <span class="sigil"></span>
      <span>AIOS</span>
    </a>
    <nav class="side-nav" aria-label="Разделы AIOS">
      <button class="side-link" id="btnNavWorkspace" type="button" hidden>Рабочее пространство</button>
      <a class="side-link" href="pilot.html">Статус пилотного проекта</a>
      <a class="side-link active" href="knowledge.html">Данные и знания</a>
      <a class="side-link" href="models.html">Модели</a>
      <a class="side-link" href="agents.html">Агенты</a>
      <a class="side-link" href="polygons.html">Полигоны</a>
    </nav>
    <div class="sidebar-footer">
      <button class="side-link" id="btnSettings" type="button" hidden>Настройки</button>
      <a class="side-link" id="menuAdmin" href="admin.html" hidden>Админ-панель</a>
      <div class="sidebar-user">
        <button class="btn-login" id="btnLogin" type="button" aria-haspopup="dialog" aria-controls="loginModal">Войти</button>
        <div class="user-menu" id="userMenu" hidden>
          <div class="user-menu-head">
            <span class="user-menu-name"></span>
            <span class="user-menu-role"></span>
          </div>
          <a class="user-menu-item" id="menuPilot" href="pilot.html" hidden>Пилот: режим администратора</a>
          <button class="user-menu-item" id="btnChangePass" type="button" hidden>Сменить пароль</button>
          <button class="user-menu-item user-menu-logout" id="btnLogout" type="button">Выйти</button>
        </div>
      </div>
    </div>
  </aside>

  <div class="page">

  <!-- ==================== Заголовок раздела ==================== -->
  <section class="section-head">
    <a href="index.html" class="backlink">← AIOS Технологического института</a>
    <h1>Данные и знания</h1>
    <div class="rule"></div>
  </section>

  <!-- ==================== Спойлер: RAG-базы ==================== -->
  <section class="spoiler" id="spoilerRag">
    <button type="button" class="spoiler-toggle" aria-expanded="false">
      <span class="spoiler-title">RAG-базы</span>
      <span class="spoiler-chevron"></span>
    </button>
    <div class="spoiler-body" hidden>
      <div class="models-grid" id="gridRag"></div>
    </div>
  </section>

  <!-- ==================== Спойлер: Онтологии ==================== -->
  <section class="spoiler" id="spoilerOnto">
    <button type="button" class="spoiler-toggle" aria-expanded="false">
      <span class="spoiler-title">Онтологии</span>
      <span class="spoiler-chevron"></span>
    </button>
    <div class="spoiler-body" hidden>
      <div class="models-grid" id="gridOnto"></div>
    </div>
  </section>

</div>

<!-- ==================== Модалка: карточка RAG-базы ==================== -->
<div class="modal-overlay" id="ragModal" hidden>
  <div class="modal modal--model">
    <button type="button" class="modal-close" id="ragModalClose" aria-label="Закрыть">&times;</button>
    <div class="mm-media">
      <img id="ragModalImg" src="" alt="">
    </div>
    <h2 id="ragModalName"></h2>
    <p class="mm-desc" id="ragModalDesc"></p>
    <div class="mm-tags" id="ragModalChips"></div>
    <div class="mm-tags" id="ragModalTags"></div>
    <p class="mm-source" id="ragModalSource"></p>
    <div class="mm-actions" id="ragModalActions"></div>
  </div>
</div>

<!-- ==================== Модалка: карточка онтологии ==================== -->
<div class="modal-overlay" id="ontoModal" hidden>
  <div class="modal modal--model">
    <button type="button" class="modal-close" id="ontoModalClose" aria-label="Закрыть">&times;</button>
    <div class="mm-media">
      <img id="ontoModalImg" src="" alt="">
    </div>
    <h2 id="ontoModalName"></h2>
    <p class="mm-desc" id="ontoModalDesc"></p>
    <div class="mm-tags" id="ontoModalChips"></div>
    <p class="mm-source" id="ontoModalProjects"></p>
    <div class="mm-tags" id="ontoModalTags"></div>
    <div class="mm-actions" id="ontoModalActions"></div>
  </div>
</div>
</div>

<script src="js/api.js?v=20260911"></script>
<script src="js/auth.js?v=20260911"></script>
<script src="js/knowledge.js?v=20260911"></script>
<script src="js/workspace.js?v=20260911"></script>

</html>
