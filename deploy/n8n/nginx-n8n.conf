# n8n за reverse-proxy: сниппет для /etc/nginx/sites-available/
#
# Нужен для двух вещей:
#   1) первичная настройка владельца (создание аккаунта и API-ключа);
#   2) внешние webhook-триггеры автоматизаций (manual-run AIOS ходит
#      напрямую на 127.0.0.1:5678, прокси ему не нужен).
#
# Установка:
#   sudo cp nginx-n8n.conf /etc/nginx/sites-available/n8n
#   sudo ln -s /etc/nginx/sites-available/n8n /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS: поддомен *.sslip.io покрывается тем же сертификатом, что и основной
# сайт (см. README «Развёртывание на VPS»); при самоподписанном сертификате
# добавьте поддомен в SAN.

server {
    listen 443 ssl;
    server_name n8n.176.108.244.194.sslip.io;

    # сертификат — тот же, что у основного сайта
    ssl_certificate     /etc/letsencrypt/live/176.108.244.194.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/176.108.244.194.sslip.io/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:5678;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # редактор n8n использует websocket-ы
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 16m;
    }
}

server {
    listen 80;
    server_name n8n.176.108.244.194.sslip.io;
    return 301 https://$host$request_uri;
}
