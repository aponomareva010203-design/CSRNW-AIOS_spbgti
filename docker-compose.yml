# Локальный запуск платформы одной командой: docker compose up --build
# Откройте http://localhost:8000 и войдите стартовым администратором
# (логин и пароль ниже; поменяйте их в файле .env рядом с этим файлом).
services:
  aios:
    build: .
    ports:
      - "${PORT:-8000}:8000"
    environment:
      AIOS_ADMIN_LOGIN: "${AIOS_ADMIN_LOGIN:-admin@university.local}"
      AIOS_ADMIN_PASSWORD: "${AIOS_ADMIN_PASSWORD:-admin12345}"
      AIOS_LLM_BASE_URL: "${AIOS_LLM_BASE_URL:-}"
      AIOS_LLM_API_KEY: "${AIOS_LLM_API_KEY:-}"
      AIOS_LLM_MODEL: "${AIOS_LLM_MODEL:-}"
      AIOS_RUNTIME_DIR: /app/.aios-runtime
      # RAG: векторная база Qdrant (сервис ниже) и модель эмбеддингов на том же
      # OpenAI-совместимом эндпоинте, что и LLM. Без них базы знаний работают
      # текстовым поиском по тем же документам.
      AIOS_QDRANT_URL: "http://qdrant:6333"
      AIOS_EMBEDDING_MODEL: "${AIOS_EMBEDDING_MODEL:-text-embedding-3-small}"
    volumes:
      # пользователи, проекты, сессии чата — переживают перезапуск контейнера
      - aios-runtime:/app/.aios-runtime
      # данные вуза: правки data/dashboard.json и data/skills/*.md видны сразу
      - ./data:/app/data
    depends_on:
      - qdrant
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.12.4
    volumes:
      - qdrant-storage:/qdrant/storage
    restart: unless-stopped

volumes:
  aios-runtime:
  qdrant-storage:
